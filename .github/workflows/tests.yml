name: Ejecutar Tests Unitarios

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restaurar dependencias
      run: dotnet restore DiarsFinal/DiarsFinal.sln

    - name: Compilar solución
      run: dotnet build DiarsFinal/DiarsFinal.sln --no-restore --configuration Release

    - name: Ejecutar solo UnitTests
      run: dotnet test TestProject1/TestProject1.csproj --no-build --configuration Release --filter "FullyQualifiedName~UnitTests" --verbosity normal
